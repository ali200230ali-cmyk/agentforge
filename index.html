<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AGENTFORGE</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        p {
            color: #94a3b8;
            font-size: 18px;
        }

        textarea {
            width: 100%;
            height: 150px;
            margin-top: 30px;
            padding: 15px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            padding: 14px 30px;
            border: none;
            border-radius: 10px;
            background: #38bdf8;
            color: #0f172a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AGENTFORGE</h1>

    <p>AI Workforce Platform</p>

    <textarea id="taskInput"
        placeholder="Describe what you want your AI team to accomplish..."></textarea>

    <br>

    <button onclick="runAgents()">BUILD AI TEAM</button>

    <div id="result"></div>

</div>

<script>

function runAgents() {

    const task = document.getElementById("taskInput").value.trim();

    if (task === "") {
        alert("Please describe your task first.");
        return;
    }

    const agents = [
        "👑 Chief Agent — Mission received: " + task,
        "📋 PM Agent — Created 3 subtasks",
        "🔎 Research Agent — Researching: " + task,
        "📊 Analysis Agent — Analyzing the research",
        "📝 Report Agent — Building the report",
        "🛡️ Critic Agent — Reviewing the work",
        "👑 Chief Agent — Preparing final result"
    ];

    const result = document.getElementById("result");

    result.innerHTML = `
        <div style="
            margin-top:30px;
            padding:20px;
            background:#1e293b;
            border-radius:12px;
            text-align:left;
        ">
            <h2>AI TEAM</h2>
            <div id="agentStatus"></div>
        </div>
    `;

    let i = 0;

    function nextAgent() {

        if (i >= agents.length) {

            document.getElementById("agentStatus").innerHTML +=
                "<p>✅ Mission Complete</p>";

            return;
        }

        document.getElementById("agentStatus").innerHTML +=
            "<p>" + agents[i] + "</p>";

        i++;

        setTimeout(nextAgent, 1000);
    }

    nextAgent();
}

</script>

</body>
</html>
