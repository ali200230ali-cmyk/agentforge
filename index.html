<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AGENTFORGE</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        p {
            color: #94a3b8;
            font-size: 18px;
        }

        textarea {
            width: 100%;
            height: 150px;
            margin-top: 30px;
            padding: 15px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            padding: 14px 30px;
            border: none;
            border-radius: 10px;
            background: #38bdf8;
            color: #0f172a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>AGENTFORGE</h1>

        <p>AI Workforce Platform</p>

        <textarea
            placeholder="Describe what you want your AI team to accomplish..."
        ></textarea>

        <br>

        <button>BUILD AI TEAM</button>

    </div>

</body>
</html>
